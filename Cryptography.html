<body>
<center>
    <bold><u><h1>CRYPTOGRAPHY</h1></u></bold><br>

    <br>

    <br>
    <center>
    <bold><label for="inputText">Enter Plaintext or Ciphertext:</label></bold>
    <textarea id="inputText" placeholder="Enter plaintext or ciphertext here..."></textarea>
    
    <bold><label for="key">Enter Key:</label></bold>
    <input type="text" id="key" placeholder="Enter key...">

    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>
    
    <label for="outputText">Output:</label>
    <textarea id="outputText" readonly placeholder="Encrypted or decrypted message..."></textarea>

    <label for="recipientEmail">Recipient's Email:</label>
    <input type="email" id="recipientEmail" placeholder="Enter recipient's email...">

    <button onclick="sendEmail()">Send Email</button>
    <br><br><br>
<a href="https://en.wikibooks.org/wiki/Cryptography/History">A Brief History of Cryptography</a>
    <br>
<hr>
<br>
<h2>To know more about cryptography: <br> visit:</h2>
<br><a href="https://www.geeksforgeeks.org/computer-networks/cryptography-and-its-types/">Criptography and its types</a>

    <script>
        function encrypt() {
            const plaintext = document.getElementById('inputText').value;
            const key = document.getElementById('key').value;
            const ciphertext = encryptText(plaintext, key);
            document.getElementById('outputText').value = ciphertext;
        }

        function decrypt() {
            const ciphertext = document.getElementById('inputText').value;
            const key = document.getElementById('key').value;
            const plaintext = decryptText(ciphertext, key);
            document.getElementById('outputText').value = plaintext;
        }

        function encryptText(plaintext, key) {
            let ciphertext = '';
            for (let i = 0; i < plaintext.length; i++) {
                let charCode = plaintext.charCodeAt(i);
                if (charCode >= 65 && charCode <= 90) { // Uppercase letters
                    ciphertext += String.fromCharCode((charCode - 65 + parseInt(key)) % 26 + 65);
                } else if (charCode >= 97 && charCode <= 122) { // Lowercase letters
                    ciphertext += String.fromCharCode((charCode - 97 + parseInt(key)) % 26 + 97);
                } else {
                    ciphertext += plaintext[i]; // Non-alphabetic characters remain unchanged
                }
            }
            return ciphertext;
        }

        function decryptText(ciphertext, key) {
            let plaintext = '';
            for (let i = 0; i < ciphertext.length; i++) {
                let charCode = ciphertext.charCodeAt(i);
                if (charCode >= 65 && charCode <= 90) { // Uppercase letters
                    plaintext += String.fromCharCode((charCode - 65 - parseInt(key) + 26) % 26 + 65);
                } else if (charCode >= 97 && charCode <= 122) { // Lowercase letters
                    plaintext += String.fromCharCode((charCode - 97 - parseInt(key) + 26) % 26 + 97);
                } else {
                    plaintext += ciphertext[i]; // Non-alphabetic characters remain unchanged
                }
            }
            return plaintext;
        }

        function sendEmail() {
            const recipientEmail = document.getElementById('recipientEmail').value;
            const text = document.getElementById('outputText').value;

            // Send the email via backend server
            // This part should be handled by a backend service
            // Using a library like Nodemailer (for Node.js) or PHPMailer (for PHP)

            // For demonstration purposes, you can display an alert
            alert(`Email sent to ${recipientEmail} with the following text:\n\n${text}`);
        }
    </script>
